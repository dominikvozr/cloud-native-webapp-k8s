{{- if .Values.monitoring.enabled }}
{{- $ctx := dict "root" . "component" "backend" -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "webapp.fullname" $ctx }}
  labels:
    {{- include "webapp.labels" $ctx | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "webapp.selectorLabels" $ctx | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
{{- end }}
