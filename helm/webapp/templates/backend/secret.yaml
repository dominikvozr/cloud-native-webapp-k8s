{{- if not .Values.backend.secret.existingSecret }}
{{- $ctx := dict "root" . "component" "backend" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "webapp.fullname" $ctx }}
  labels:
    {{- include "webapp.labels" $ctx | nindent 4 }}
type: Opaque
data:
  ADMIN_TOKEN: {{ .Values.backend.secret.adminToken | b64enc | quote }}
{{- end }}
