{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: {{ .Chart.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # only /api is routed to the backend, /metrics and probes stay internal
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "webapp.fullname" (dict "root" . "component" "backend") }}
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "webapp.fullname" (dict "root" . "component" "frontend") }}
                port:
                  name: http
{{- end }}
