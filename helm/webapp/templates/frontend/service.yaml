{{- $ctx := dict "root" . "component" "frontend" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "webapp.fullname" $ctx }}
  labels:
    {{- include "webapp.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "webapp.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
