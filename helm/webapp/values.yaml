ingress:
  enabled: true
  className: nginx
  host: webapp.local

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  monitoringNamespace: monitoring

backend:
  image:
    repository: ghcr.io/dominikvozr/cloud-native-webapp-k8s/backend
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 2
  config:
    message: Hello from Kubernetes
  secret:
    existingSecret: ""
    adminToken: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1

frontend:
  image:
    repository: ghcr.io/dominikvozr/cloud-native-webapp-k8s/frontend
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 2
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 64Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1
